name: Realistic Human Demo CI

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - "tests/test_realistic_human_demo.py"
      - "tests/test_human_sweep_experiment.py"
      - "benchmark/render_shared_success_case.py"
      - "benchmark/human_sweep_experiment.py"
      - ".github/workflows/realistic-human-demo-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy cvxpy osqp matplotlib pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run human simulation regressions
        run: pytest -q tests/test_realistic_human_demo.py tests/test_human_sweep_experiment.py
