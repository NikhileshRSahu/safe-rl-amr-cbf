name: Forecast STASAC Integration Tests

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - "benchmark/stasac_warehouse.py"
      - "benchmark/spatiotemporal_policy.py"
      - "benchmark/train_stasac_cbf.py"
      - "benchmark/stasac_training_runner.py"
      - "benchmark/best_vs_best_runner.py"
      - "benchmark/train_human_forecaster.py"
      - "benchmark/human_*.py"
      - "benchmark/forecast_*.py"
      - "tests/test_forecast_warehouse_observation.py"
      - "tests/test_forecast_stasac_policy.py"
      - "tests/test_train_human_forecaster.py"
      - "tests/test_forecast_stasac_training_runner.py"
      - "tests/test_forecast_best_vs_best.py"
      - ".github/workflows/forecast-integration-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy cvxpy osqp pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run integration tests
        run: |
          pytest -q \
            tests/test_train_human_forecaster.py \
            tests/test_forecast_warehouse_observation.py \
            tests/test_forecast_stasac_policy.py \
            tests/test_forecast_stasac_training_runner.py \
            tests/test_forecast_best_vs_best.py \
            tests/test_spatiotemporal_policy.py \
            tests/test_stasac_training_runner.py \
            tests/test_best_vs_best_protocol.py \
            tests/test_best_vs_best_evaluation.py
