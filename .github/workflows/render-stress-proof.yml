name: Render Verified ORCA RL Stress Proof

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - "benchmark/render_stress_proof_case.py"
      - ".github/workflows/render-stress-proof.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      RUN11_ARTIFACT_ID: 10613786048
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy cvxpy osqp matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download exact Run 11 checkpoint
        run: |
          mkdir -p results/run11
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN11_ARTIFACT_ID}/zip" \
            > /tmp/run11.zip
          unzip -oq /tmp/run11.zip -d results/run11
          test -s results/run11/shared_sac_cbf.pt

      - name: Render exact verified stress seed
        run: |
          python benchmark/render_stress_proof_case.py \
            --seed 8100 \
            --humans 12 \
            --speed-scale 1.5 \
            --checkpoint results/run11/shared_sac_cbf.pt \
            --config benchmark/frozen_peak_orca_config.json \
            --out results/stress_proof_8100

      - name: Verify expected proof outcome
        run: |
          python - <<'PY'
          import json
          p=json.load(open('results/stress_proof_8100/metadata.json'))
          assert p['sac_cbf']['success'] == 4
          assert p['sac_cbf']['collision'] == 0
          assert p['peak_orca_dd']['success'] == 2
          assert p['peak_orca_dd']['collision'] == 0
          assert p['peak_orca_dd']['timeout'] == 2
          print('VERIFIED:', json.dumps(p, indent=2))
          PY
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 results/stress_proof_8100/sac_cbf_proof.mp4
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 results/stress_proof_8100/peak_orca_proof.mp4

      - name: Upload proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-stress-proof-seed8100
          path: results/stress_proof_8100/
          if-no-files-found: error
