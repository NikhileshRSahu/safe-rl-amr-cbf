name: Peak ORCA Sharded Final

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - ".github/workflows/peak-orca-sharded-final.yml"
      - "benchmark/evaluate_beast_shard.py"
      - "benchmark/frozen_peak_orca_config.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy cvxpy osqp pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify controller and frozen config
        run: |
          pytest -q tests/test_orca_geometry.py tests/test_dd_motion.py tests/test_beast_classical.py tests/test_beast_benchmark.py tests/test_beast_scenarios.py
          python - <<'PY'
          from benchmark.beast_config import TEST_SEEDS_BY_N, load_beast_config
          expected={2:tuple(range(6200,6230)),4:tuple(range(6400,6430)),6:tuple(range(6600,6630))}
          assert TEST_SEEDS_BY_N == expected
          c=load_beast_config('benchmark/frozen_peak_orca_config.json')
          assert c.time_horizon == 3.0 and c.arc_horizon == 1.0 and c.lookahead_distance == 1.8 and c.replan_interval == 12
          print(c)
          PY

  shard:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        n: [2, 4, 6]
        controller: [sac_cbf, astar_orca_dd]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      RUN11_ARTIFACT_ID: "10613786048"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy cvxpy osqp
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact Run 11 checkpoint
        if: matrix.controller == 'sac_cbf'
        run: |
          mkdir -p results/run11
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN11_ARTIFACT_ID}/zip" > /tmp/run11.zip
          unzip -oq /tmp/run11.zip -d results/run11
          test -s results/run11/shared_sac_cbf.pt
      - name: Run fresh final shard
        run: |
          mkdir -p results/shards
          EXTRA=""
          if [ "${{ matrix.controller }}" = "sac_cbf" ]; then
            EXTRA="--checkpoint results/run11/shared_sac_cbf.pt"
          fi
          python benchmark/evaluate_beast_shard.py \
            --n "${{ matrix.n }}" \
            --controller "${{ matrix.controller }}" \
            --config benchmark/frozen_peak_orca_config.json \
            $EXTRA \
            --out "results/shards/${{ matrix.n }}-${{ matrix.controller }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: peak-shard-${{ matrix.n }}-${{ matrix.controller }}
          path: results/shards/*.json
          if-no-files-found: error

  aggregate:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: peak-shard-*
          path: results/shards
          merge-multiple: true
      - name: Build final table
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          print('| Fleet | Controller | Success | Collision | Timeout | Fleet success | Path m* | Time s* | Throughput/min | Compute ms/agent-step |')
          print('|---:|---|---:|---:|---:|---:|---:|---:|---:|---:|')
          summary={}
          for n in (2,4,6):
              summary[str(n)]={}
              for key,label in [('sac_cbf','SAC + CBF'),('astar_orca_dd','Peak A* + ORCA-DD')]:
                  p=Path(f'results/shards/{n}-{key}.json')
                  d=json.loads(p.read_text())
                  r=d['aggregate']; summary[str(n)][key]=r
                  pct=lambda x:f'{100*x:.1f}%'
                  num=lambda x:'—' if x is None else f'{x:.2f}'
                  print(f"| {n} | {label} | {pct(r['success_rate'])} | {pct(r['collision_rate'])} | {pct(r['timeout_rate'])} | {pct(r['fleet_success_rate'])} | {num(r['path_length_success_mean'])} | {num(r['traversal_time_success_mean'])} | {r['mean_throughput_per_min']:.2f} | {r['mean_controller_ms_per_agent_step']:.3f} |")
          Path('results/final_summary.json').write_text(json.dumps(summary,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: peak-orca-final-sharded-results
          path: |
            results/shards/*.json
            results/final_summary.json
          if-no-files-found: error
