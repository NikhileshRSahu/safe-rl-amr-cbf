name: STASAC Development Tests

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - "benchmark/warehouse_interaction_features.py"
      - "benchmark/shared_warehouse_perception.py"
      - "benchmark/spatiotemporal_policy.py"
      - "benchmark/train_stasac_cbf.py"
      - "benchmark/stasac_warehouse.py"
      - "benchmark/stasac_training_runner.py"
      - "benchmark/orca_teacher.py"
      - "benchmark/adaptive_predictive_orca.py"
      - "benchmark/best_vs_best_protocol.py"
      - "benchmark/best_vs_best_evaluation.py"
      - "tests/test_warehouse_interaction_features.py"
      - "tests/test_shared_warehouse_perception.py"
      - "tests/test_spatiotemporal_policy.py"
      - "tests/test_stasac_training.py"
      - "tests/test_stasac_warehouse.py"
      - "tests/test_stasac_training_runner.py"
      - "tests/test_orca_teacher_warmstart.py"
      - "tests/test_best_vs_best_protocol.py"
      - "tests/test_best_vs_best_evaluation.py"
      - ".github/workflows/stasac-development-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy cvxpy osqp pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run STASAC development tests
        run: |
          pytest -q \
            tests/test_warehouse_interaction_features.py \
            $(test -f tests/test_shared_warehouse_perception.py && echo tests/test_shared_warehouse_perception.py) \
            $(test -f tests/test_spatiotemporal_policy.py && echo tests/test_spatiotemporal_policy.py) \
            $(test -f tests/test_stasac_training.py && echo tests/test_stasac_training.py) \
            $(test -f tests/test_stasac_warehouse.py && echo tests/test_stasac_warehouse.py) \
            $(test -f tests/test_stasac_training_runner.py && echo tests/test_stasac_training_runner.py) \
            $(test -f tests/test_orca_teacher_warmstart.py && echo tests/test_orca_teacher_warmstart.py) \
            $(test -f tests/test_best_vs_best_protocol.py && echo tests/test_best_vs_best_protocol.py) \
            $(test -f tests/test_best_vs_best_evaluation.py && echo tests/test_best_vs_best_evaluation.py)
