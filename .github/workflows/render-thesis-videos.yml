name: Render Thesis Comparison Videos

on:
  push:
    branches:
      - research/multi-agent-sac-cbf-v1
    paths:
      - ".github/workflows/render-thesis-videos.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy torch matplotlib cvxpy osqp
      - name: Download exact Run 11 checkpoint artifact
        run: |
          mkdir -p results/run11
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NikhileshRSahu/safe-rl-amr-cbf/actions/artifacts/10613786048/zip" \
            -o /tmp/run11.zip
          unzip -q /tmp/run11.zip -d results/run11
          test -f results/run11/shared_sac_cbf.pt
          ls -lh results/run11/shared_sac_cbf.pt
      - name: Render same-seed thesis videos
        run: |
          python benchmark/render_thesis_videos.py \
            --checkpoint results/run11/shared_sac_cbf.pt \
            --out results/thesis_videos
      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: thesis-comparison-videos
          path: results/thesis_videos/
          if-no-files-found: error
