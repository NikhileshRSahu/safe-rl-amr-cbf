name: Intent Shift Benchmark CI

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - 'tests/test_intent_shift_benchmark.py'
      - 'tests/test_observable_adaptive_orca.py'
      - 'benchmark/intent_shift_benchmark.py'
      - '.github/workflows/intent-shift-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2.0' scipy cvxpy osqp matplotlib pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run regression
        run: pytest -q tests/test_intent_shift_benchmark.py tests/test_observable_adaptive_orca.py
