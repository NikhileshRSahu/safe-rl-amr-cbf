name: Intent RL Confirmation

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - '.github/workflows/intent-rl-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      RL_ARTIFACT_ID: 10855066999
      CONFIRM_SEEDS: '13010,13011,13012,13013,13014,13015,13016,13017,13018,13019'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2.0' scipy cvxpy osqp matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download selected shield-aware SAC artifact
        run: |
          mkdir -p results/selected_rl
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RL_ARTIFACT_ID}/zip" > /tmp/rl.zip
          unzip -oq /tmp/rl.zip -d results/selected_rl
          test -s results/selected_rl/intent_sac_40000.pt
      - name: Confirm selected SAC+CBF
        run: |
          python benchmark/evaluate_intent_best_vs_best.py \
            --mode sac \
            --seeds "$CONFIRM_SEEDS" \
            --checkpoint results/selected_rl/intent_sac_40000.pt \
            --config benchmark/frozen_peak_orca_config.json \
            --out results/shield_sac_confirm.json
      - uses: actions/upload-artifact@v4
        with:
          name: shield-sac-confirm
          path: results/shield_sac_confirm.json
          if-no-files-found: error
