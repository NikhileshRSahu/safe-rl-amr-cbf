name: Beast Controller Evaluation

on:
  push:
    branches:
      - research/beast-baselines-v1
    paths:
      - ".github/workflows/beast-controller-eval.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy torch cvxpy osqp

      - name: Download exact Run 11 checkpoint
        run: |
          mkdir -p results/run11
          curl -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/NikhileshRSahu/safe-rl-amr-cbf/actions/artifacts/10613786048/zip" \
            -o /tmp/run11.zip
          unzip -q /tmp/run11.zip -d results/run11
          test -f results/run11/shared_sac_cbf.pt

      - name: Smoke test strengthened classical controller
        run: |
          python - <<'PY'
          from benchmark.train_multi_agent_research import World
          from benchmark.beast_classical import AStarReciprocalVO
          w=World(2,4,5200); w.reset()
          c=AStarReciprocalVO(w,0)
          a=c.action(w)
          assert a.shape == (2,)
          print("smoke action",a)
          PY

      - name: Run 30-seed fair evaluation
        run: |
          python benchmark/evaluate_beast_controllers.py \
            --checkpoint results/run11/shared_sac_cbf.pt \
            --seeds 30 \
            --seed-base 5000 \
            --out results/beast_eval

      - name: Upload evaluation
        uses: actions/upload-artifact@v4
        with:
          name: beast-controller-evaluation
          path: results/beast_eval/
          if-no-files-found: error
