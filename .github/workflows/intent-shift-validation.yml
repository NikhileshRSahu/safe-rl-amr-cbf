name: Intent Shift Validation

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - 'benchmark/intent_shift_benchmark.py'
      - 'benchmark/evaluate_intent_best_vs_best.py'
      - '.github/workflows/intent-shift-validation.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: sac, mode: sac, candidate: 0}
          - {name: peak_orca, mode: peak_orca, candidate: 0}
          - {name: adaptive_0, mode: adaptive, candidate: 0}
          - {name: adaptive_1, mode: adaptive, candidate: 1}
          - {name: adaptive_2, mode: adaptive, candidate: 2}
          - {name: adaptive_3, mode: adaptive, candidate: 3}
          - {name: adaptive_4, mode: adaptive, candidate: 4}
          - {name: adaptive_5, mode: adaptive, candidate: 5}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      RUN11_ARTIFACT_ID: 10613786048
      VAL_SEEDS: '13000,13001,13002,13003,13004'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2.0' scipy cvxpy osqp matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact Run 11 checkpoint
        if: matrix.mode == 'sac'
        run: |
          mkdir -p results/run11
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN11_ARTIFACT_ID}/zip" > /tmp/run11.zip
          unzip -oq /tmp/run11.zip -d results/run11
          test -s results/run11/shared_sac_cbf.pt
      - name: Evaluate validation seeds
        run: |
          EXTRA=''
          if [ '${{ matrix.mode }}' = 'sac' ]; then EXTRA='--checkpoint results/run11/shared_sac_cbf.pt'; fi
          python benchmark/evaluate_intent_best_vs_best.py \
            --mode '${{ matrix.mode }}' \
            --candidate '${{ matrix.candidate }}' \
            --seeds "$VAL_SEEDS" \
            --config benchmark/frozen_peak_orca_config.json \
            $EXTRA \
            --out 'results/${{ matrix.name }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: intent-validation-${{ matrix.name }}
          path: results/${{ matrix.name }}.json
          if-no-files-found: error
