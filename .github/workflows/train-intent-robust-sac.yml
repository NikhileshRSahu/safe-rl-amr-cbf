name: Train Intent Robust SAC CBF

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - 'benchmark/train_intent_robust_sac.py'
      - '.github/workflows/train-intent-robust-sac.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [61, 71]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: .
      GH_TOKEN: ${{ github.token }}
      RUN11_ARTIFACT_ID: 10613786048
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2.0' scipy cvxpy osqp
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Download exact Run 11 checkpoint
        run: |
          mkdir -p results/run11
          gh api -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUN11_ARTIFACT_ID}/zip" > /tmp/run11.zip
          unzip -oq /tmp/run11.zip -d results/run11
          test -s results/run11/shared_sac_cbf.pt
      - name: Fine tune on intent-shift training seeds
        run: |
          python benchmark/train_intent_robust_sac.py \
            --checkpoint results/run11/shared_sac_cbf.pt \
            --agent-steps 60000 \
            --seed '${{ matrix.seed }}' \
            --out 'results/intent_sac_${{ matrix.seed }}'
      - uses: actions/upload-artifact@v4
        with:
          name: intent-robust-sac-${{ matrix.seed }}
          path: results/intent_sac_${{ matrix.seed }}/
          if-no-files-found: error
