name: Multi-Agent SAC-CBF Research

on:
  push:
    branches:
      - research/multi-agent-sac-cbf-v1
    paths:
      - "benchmark/train_multi_agent_research.py"
      - ".github/workflows/multi-agent-research.yml"
  workflow_dispatch:

jobs:
  train-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy torch
      - name: Syntax check
        run: python -m py_compile benchmark/train_multi_agent_research.py cbf.py utils.py config.py
      - name: Run multi-agent training and held-out evaluation
        run: |
          python benchmark/train_multi_agent_research.py             --agent-steps 50000             --seed 52             --out results/multi_agent_run
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-agent-sac-cbf-results
          path: results/multi_agent_run/
          if-no-files-found: warn
