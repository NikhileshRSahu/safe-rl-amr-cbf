name: Intent ORCA Confirmation

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - 'benchmark/frozen_adaptive_orca_intent.json'
      - '.github/workflows/intent-orca-confirmation.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: .
      CONFIRM_SEEDS: '13010,13011,13012,13013,13014,13015,13016,13017,13018,13019'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install 'numpy<2.0' scipy cvxpy osqp matplotlib
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Confirm observable Adaptive ORCA candidate 2
        run: |
          python benchmark/evaluate_intent_best_vs_best.py \
            --mode adaptive \
            --candidate 2 \
            --seeds "$CONFIRM_SEEDS" \
            --config benchmark/frozen_peak_orca_config.json \
            --out results/observable_adaptive_orca_confirm.json
      - uses: actions/upload-artifact@v4
        with:
          name: observable-adaptive-orca-confirm
          path: results/observable_adaptive_orca_confirm.json
          if-no-files-found: error
