name: ORCA-DD development tests

on:
  push:
    branches:
      - research/beast-baselines-v1
    paths:
      - "benchmark/orca_geometry.py"
      - "benchmark/dd_motion.py"
      - "benchmark/beast_classical.py"
      - "benchmark/beast_config.py"
      - "benchmark/tune_beast_classical.py"
      - "benchmark/evaluate_beast_controllers.py"
      - "tests/test_orca_geometry.py"
      - "tests/test_dd_motion.py"
      - "tests/test_beast_classical.py"
      - "tests/test_beast_benchmark.py"
      - "tests/test_beast_scenarios.py"
      - ".github/workflows/orca-dd-dev-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" scipy torch cvxpy osqp pytest
      - name: Run ORCA-DD focused tests
        run: |
          files=""
          for f in tests/test_orca_geometry.py tests/test_dd_motion.py tests/test_beast_classical.py tests/test_beast_benchmark.py tests/test_beast_scenarios.py; do
            if [ -f "$f" ]; then files="$files $f"; fi
          done
          test -n "$files"
          pytest -q $files
