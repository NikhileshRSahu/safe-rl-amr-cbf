name: Frozen Forecast Evaluation Protocol Tests

on:
  push:
    branches: [research/beast-baselines-v1]
    paths:
      - "benchmark/best_vs_best_runner.py"
      - "benchmark/select_fully_trained_forecast_stasac.py"
      - "benchmark/select_peak_ap_orca.py"
      - "benchmark/run_frozen_forecast_vs_peak_orca.py"
      - "tests/test_frozen_forecast_selection.py"
      - ".github/workflows/frozen-forecast-eval-protocol-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest "numpy<2.0" scipy cvxpy osqp
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile frozen protocol scripts
        run: |
          python -m py_compile \
            benchmark/best_vs_best_runner.py \
            benchmark/select_fully_trained_forecast_stasac.py \
            benchmark/select_peak_ap_orca.py \
            benchmark/run_frozen_forecast_vs_peak_orca.py
      - name: Run protocol unit tests
        run: |
          pytest -q \
            tests/test_best_vs_best_evaluation.py \
            tests/test_frozen_forecast_selection.py
